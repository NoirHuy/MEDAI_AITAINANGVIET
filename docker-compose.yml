services:
  backend:
    build:
      context: ./back_end
    env_file:
      - ./back_end/.env
    environment:
      # Overrides whatever's in back_end/.env — inside Compose, the
      # frontend is reached at this origin, not the local dev ports.
      CLIENT_ORIGIN: http://localhost:8080
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/medchat}
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    expose:
      - '4000'

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ''
        # Sourced from the root .env (same value used by `npm run dev`).
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend
    env_file:
      - ./back_end/.env
    environment:
      - PORT=7860
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/medchat}
    ports:
      - '8080:7860'
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    container_name: medchat-mongodb
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  ninerouter:
    image: decolua/9router:latest
    container_name: medchat-ninerouter
    ports:
      - '20128:20128'
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ninerouter_data:/app/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5.18-community
    container_name: medchat-neo4j
    environment:
      - NEO4J_AUTH=neo4j/MatKhauNeo4j2026!
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  backend_data:
  mongodb_data:
  ninerouter_data:
  neo4j_data:

