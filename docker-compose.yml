services:
  backend:
    build:
      context: ./back_end
    env_file:
      - ./back_end/.env
    environment:
      # Overrides whatever's in back_end/.env — inside Compose, the
      # frontend is reached at this origin, not the local dev ports.
      CLIENT_ORIGIN: http://localhost:8080
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/medchat}
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    expose:
      - '4000'

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ''
        # Sourced from the root .env (same value used by `npm run dev`).
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend
    env_file:
      - ./back_end/.env
    environment:
      - PORT=7860
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/medchat}
    ports:
      - '8080:7860'
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    container_name: medchat-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    command: mongod --auth
    ports:
      - '27018:27017'
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  ninerouter:
    image: decolua/9router:latest
    container_name: medchat-ninerouter
    ports:
      - '20128:20128'
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ninerouter_data:/app/data
    restart: unless-stopped

volumes:
  backend_data:
  mongodb_data:
  ninerouter_data:
