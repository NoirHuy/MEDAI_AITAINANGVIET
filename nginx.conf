server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Proxied to the backend container so the SPA can call same-origin
    # relative paths (/api/...) — no CORS, and cookies work as first-party.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_buffering off; # keep chat replies streaming, not buffered
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:4000/health;
    }

    # SPA fallback so client-side routing (and hard refreshes) resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
